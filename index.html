<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dress Material Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .toolbar {
      text-align: center;
      margin-bottom: 20px;
    }

    .toolbar button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 5px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .card-content {
      padding: 15px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 10px;
      color: #34495e;
      text-align: center;
    }

    .price {
      font-size: 16px;
      color: #27ae60;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      h2 { font-size: 22px; }
    }
	
	.top-bar {
	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	  margin-bottom: 20px;
	  flex-wrap: wrap;
	}

	.top-bar h2 {
	  margin: 0;
	  font-size: 24px;
	  color: #2c3e50;
	}

	.toolbar button {
	  padding: 10px 20px;
	  font-size: 14px;
	  cursor: pointer;
	  background-color: #2c3e50;
	  color: white;
	  border: none;
	  border-radius: 5px;
	}

  </style>
</head>
<body>

  <div class="top-bar">
  <h2>🌸 Dress Material Collection</h2>
  <div class="toolbar">
    <button id="sort-button">Sort by Price (Low to High)</button>
  </div>
</div>

  <div class="container" id="product-list">Loading...</div>

  <script src="script.js"></script>

</body>
</html>
